services:
  - type: web
    name: interviewos-ai-api-ab2005
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_DAYS
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        value: https://interviewos-ai-web-ab2005.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

  - type: web
    name: interviewos-ai-web-ab2005
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: HOST
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://interviewos-ai-api-ab2005.onrender.com/api
